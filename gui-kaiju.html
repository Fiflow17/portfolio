<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="GUI Kaiju case study by Florian Basanta: HUD, UX flows, and interface explorations for a stylized action game." />
<meta property="og:title" content="GUI KAIJU — UI Explorations" />
<meta property="og:description" content="HUD, UX flows, and interface explorations for a stylized action game." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary" />
<title>GUI KAIJU — UI Explorations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#090c0f;
  --line:rgba(255,255,255,.08);
  --text:#eef4f6;
  --muted:rgba(238,244,246,.62);
  --accent:#62cbff;
  --max:1460px;
  --radius:24px;
  --gap:18px;
  --px:clamp(2rem,5vw,5rem);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--text);
  font-family:"DM Sans",sans-serif;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 73% 70%, rgba(79,188,232,.14), transparent 28%),
    radial-gradient(circle at 60% 34%, rgba(255,255,255,.04), transparent 22%),
    linear-gradient(180deg, #0a0d10 0%, #090c0f 100%);
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{
  outline:2px solid var(--accent, var(--ac, #fff));
  outline-offset:2px;
  border-radius:6px;
}

.shell{width:100%;max-width:none;margin:0 auto;padding:88px var(--px) 60px}
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  backdrop-filter:blur(16px);
  background:rgba(10,10,10,.92);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  gap:24px;
  padding:1rem var(--px);
}
.brand{font-family:"Syne",sans-serif;font-weight:800;font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.nav-home-link{font-family:"DM Mono",monospace;font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:.4rem;flex-shrink:0}
.nav-home-link:hover{color:var(--text)}

.hero{
  position:relative;
  border:1px solid var(--line);
  border-radius:32px;
  overflow:hidden;
  background:
    radial-gradient(circle at 65% 62%, rgba(98,203,255,.18), transparent 26%),
    radial-gradient(circle at 53% 40%, rgba(255,255,255,.05), transparent 18%),
    linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
  min-height:560px;
  margin-bottom:22px;
}
.hero::before{
  content:"";
  position:absolute;inset:0;
  background:
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(180deg, rgba(255,255,255,.02) 1px, transparent 1px);
  background-size:80px 80px;
  opacity:.16;
  pointer-events:none;
}
.hero-inner{position:relative;z-index:1;display:block;min-height:560px;padding:48px 44px 34px}
.hero-copy{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;max-width:920px;min-height:478px}
.eyebrow{font-family:"DM Mono",monospace;font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
h1{margin:0 0 18px;font-family:"Syne",sans-serif;font-weight:800;line-height:1;letter-spacing:-.035em;font-size:clamp(1.8rem,4.4vw,4rem);white-space:nowrap;text-transform:uppercase}
.hero p{margin:0 0 26px;max-width:790px;color:var(--muted);font-size:clamp(1rem,1.4vw,1.12rem);line-height:1.6}
.pills{display:flex;flex-wrap:wrap;gap:12px}
.pill{border:1px solid rgba(98,203,255,.28);background:rgba(98,203,255,.09);color:#caf2ff;border-radius:999px;padding:11px 15px;font-family:"DM Mono",monospace;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}

.section-title{margin:0 0 14px;padding:0 2px;font-family:"Syne",sans-serif;font-size:1.2rem;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.card{position:relative;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,.01));}
.card.wide{grid-column:1 / -1}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;cursor:zoom-in;transition:transform .4s ease, filter .4s ease}
.card.wide img{aspect-ratio:16/9}
.card:hover img{transform:scale(1.012);filter:brightness(1.03)}
.frame-index{position:absolute;top:12px;left:12px;z-index:2;padding:7px 9px;border-radius:10px;border:1px solid rgba(255,255,255,.09);background:rgba(8,11,14,.74);font-family:"DM Mono",monospace;font-size:.68rem;letter-spacing:.08em;color:#fff}

.lightbox{position:fixed;inset:0;background:rgba(3,5,6,.94);display:none;align-items:center;justify-content:center;z-index:60;padding:24px;cursor:zoom-out}
.lightbox.open{display:flex}
.lightbox img{max-width:95vw;max-height:92vh;object-fit:contain;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.close{position:fixed;top:18px;right:24px;color:white;font-size:40px;line-height:1;opacity:.75;pointer-events:none}

@media (max-width:900px){
  .grid{grid-template-columns:1fr}
  .card.wide{grid-column:auto}
  .card.wide img,.card img{aspect-ratio:16/10}
  .topbar{padding:1rem var(--px)}
  .hero-inner{padding:34px 24px 26px}
  .hero-copy{min-height:auto}
  h1{max-width:100%;white-space:normal;overflow-wrap:anywhere;font-size:clamp(1.7rem,7vw,2.8rem);line-height:.95}
}
@media (max-width:680px){
  .shell{padding-top:82px}
  .hero-inner{padding:28px 18px 22px}
  .eyebrow{font-size:.62rem;letter-spacing:.1em}
  h1{font-size:clamp(1.45rem,9vw,2.1rem);letter-spacing:-.02em;line-height:.96}
  .hero p{font-size:.95rem;line-height:1.52}
  .pills{gap:9px}
  .pill{padding:10px 12px;font-size:.64rem}
}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="brand">FB</div>
    <a href="./index.html" class="nav-home-link" aria-label="Back to portfolio">← Back</a>
  </header>

  <section class="hero" id="overview">
    <div class="hero-inner">
      <div class="hero-copy">
        <div class="eyebrow">Portfolio · Game UI / GUI</div>
        <h1>GUI KAIJU</h1>
        <p>A visual exploration of HUD, combat feedback, iconography, progression systems and menu flows designed for a sci-fi action game.</p>
        <div class="pills">
          <span class="pill">HUD Systems</span>
          <span class="pill">Combat Feedback</span>
          <span class="pill">Inventory</span>
          <span class="pill">Skills & Options</span>
        </div>
      </div>
    </div>
  </section>

  <h2 class="section-title" id="gallery">Selected Screens</h2>
  <section class="grid">
    <article class="card wide"><div class="frame-index">01</div><img class="zoomable" alt="Kaiju cover" src="./kaiju_assets/01_cover.png"/></article>
    <article class="card"><div class="frame-index">02</div><img class="zoomable" alt="Kaiju screen 02" src="./kaiju_assets/02.png"/></article>
    <article class="card"><div class="frame-index">03</div><img class="zoomable" alt="Kaiju screen 03" src="./kaiju_assets/03.png"/></article>
    <article class="card"><div class="frame-index">04</div><img class="zoomable" alt="Kaiju screen 04" src="./kaiju_assets/04.png"/></article>
    <article class="card"><div class="frame-index">05</div><img class="zoomable" alt="Kaiju screen 05" src="./kaiju_assets/05.png"/></article>
    <article class="card"><div class="frame-index">06</div><img class="zoomable" alt="Kaiju screen 06" src="./kaiju_assets/06.png"/></article>
    <article class="card"><div class="frame-index">07</div><img class="zoomable" alt="Kaiju screen 07" src="./kaiju_assets/07.png"/></article>
    <article class="card"><div class="frame-index">08</div><img class="zoomable" alt="Kaiju screen 08" src="./kaiju_assets/08.png"/></article>
    <article class="card"><div class="frame-index">09</div><img class="zoomable" alt="Kaiju screen 09" src="./kaiju_assets/09.png"/></article>
    <article class="card"><div class="frame-index">10</div><img class="zoomable" alt="Kaiju screen 10" src="./kaiju_assets/10.png"/></article>
    <article class="card"><div class="frame-index">11</div><img class="zoomable" alt="Kaiju screen 11" src="./kaiju_assets/11.png"/></article>
    <article class="card"><div class="frame-index">12</div><img class="zoomable" alt="Kaiju screen 12" src="./kaiju_assets/12.png"/></article>
    <article class="card"><div class="frame-index">13</div><img class="zoomable" alt="Kaiju screen 13" src="./kaiju_assets/13.png"/></article>
    <article class="card"><div class="frame-index">14</div><img class="zoomable" alt="Kaiju screen 14" src="./kaiju_assets/14.png"/></article>
    <article class="card"><div class="frame-index">15</div><img class="zoomable" alt="Kaiju screen 15" src="./kaiju_assets/15.png"/></article>
  </section>
</main>

<div class="lightbox" id="lightbox">
  <div class="close" aria-hidden="true">&times;</div>
  <img id="lightboxImage" src="" alt=""/>
</div>
<script>
const lightbox = document.getElementById('lightbox');
const lightboxImage = document.getElementById('lightboxImage');

function openLightbox(img){
  lightboxImage.src = img.src;
  lightboxImage.alt = img.alt || 'Preview image';
  lightbox.classList.add('open');
}

function closeLightbox(){
  lightbox.classList.remove('open');
  lightboxImage.src = '';
}

document.querySelectorAll('.card img').forEach((img, idx) => {
  img.loading = idx < 2 ? 'eager' : 'lazy';
  img.decoding = 'async';
  img.addEventListener('click', () => openLightbox(img));
});

lightboxImage.addEventListener('click', (e) => e.stopPropagation());
lightbox.addEventListener('click', closeLightbox);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLightbox();
});
</script>
</body>
</html>
