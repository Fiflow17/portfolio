<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 — Page introuvable</title>
<style>
  :root { --bg:#0a0a0a; --tx:#f0ede8; --mu:rgba(240,237,232,.55); --bd:rgba(255,255,255,.1); }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 2rem;
    background: var(--bg); color: var(--tx);
    font-family: system-ui, sans-serif; font-weight: 300; line-height: 1.6;
  }
  main { text-align: center; max-width: 28rem; }
  h1 { font-size: 1rem; letter-spacing: .12em; text-transform: uppercase; color: var(--mu); margin-bottom: .75rem; }
  p { margin-bottom: 1.5rem; color: var(--mu); font-size: .95rem; }
  a {
    display: inline-block; color: var(--tx); text-decoration: none;
    font-size: .75rem; letter-spacing: .1em; text-transform: uppercase;
    border: 1px solid var(--bd); padding: .6rem 1.1rem; border-radius: 999px;
    transition: background .2s, border-color .2s;
  }
  a:hover { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.2); }
</style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Cette page n’existe pas ou l’URL a changé.</p>
    <a href="/">Retour au portfolio</a>
  </main>
</body>
</html>
